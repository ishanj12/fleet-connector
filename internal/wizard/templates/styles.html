{{define "styles"}}
<style>
  :root {
    --primary: #155eef;
    --primary-hover: #0e4fd1;
    --bg: #f5f6fa;
    --card-bg: #ffffff;
    --border: #e5e7eb;
    --text: #111827;
    --text-muted: #6b7280;
    --danger: #dc2626;
    --danger-bg: #fef2f2;
    --danger-border: #fecaca;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 640px;
    margin: 0 auto;
    padding: 48px 24px;
    line-height: 1.5;
  }
  h1 { font-size: 26px; font-weight: 700; margin: 0 0 8px; }
  p.hint { color: var(--text-muted); font-size: 14px; margin: 0 0 24px; }
  .required { color: var(--danger); }
  .error-banner {
    background: var(--danger-bg); border: 1px solid var(--danger-border); color: var(--danger);
    border-radius: 10px; padding: 12px 16px; font-size: 14px; margin-bottom: 20px;
  }

  .card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px 24px; margin-bottom: 16px;
  }
  .card-title { font-weight: 600; font-size: 16px; margin: 0 0 16px; }

  label { display: block; margin-bottom: 14px; font-size: 14px; font-weight: 500; }
  label.checkbox { display: flex; align-items: center; gap: 8px; font-weight: 400; }
  label.checkbox input { width: auto; margin: 0; }

  .password-field { position: relative; }
  .password-field input { padding-right: 40px; }
  .password-toggle {
    position: absolute; right: 4px; top: 6px;
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; background: none; border: none; color: var(--text-muted); padding: 0;
  }
  .password-toggle:hover { color: var(--text); }
  .password-toggle svg { width: 18px; height: 18px; }

  input[type=text], input:not([type]), input[type=password], textarea, select {
    width: 100%; margin-top: 6px; padding: 9px 12px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 14px; font-family: inherit; background: #fff; color: var(--text);
  }
  input:focus, textarea:focus, select:focus {
    outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(21, 94, 239, 0.15);
  }
  textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }

  button { font-family: inherit; cursor: pointer; }
  .btn-primary {
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--primary); color: #fff; border: none;
    padding: 10px 22px; border-radius: 999px; font-size: 14px; font-weight: 600;
  }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-secondary {
    display: inline-flex; align-items: center; justify-content: center;
    background: #fff; color: var(--text); border: 1px solid var(--border);
    padding: 10px 22px; border-radius: 999px; font-size: 14px; font-weight: 600;
  }
  .btn-secondary:hover { background: #f9fafb; }
  .btn-dark {
    display: inline-flex; align-items: center; gap: 8px; justify-content: center;
    background: #111827; color: #fff; border: none;
    padding: 10px 20px; border-radius: 999px; font-size: 14px; font-weight: 600;
  }
  .btn-dark:hover { background: #000; }
  .btn-dark svg { width: 16px; height: 16px; }

  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; background: #fff; border: 1px solid var(--border);
    border-radius: 50%; color: var(--primary); padding: 0; flex-shrink: 0;
  }
  .icon-btn.danger { border-color: var(--danger-border); color: var(--danger); background: var(--danger-bg); }
  .icon-btn svg { width: 14px; height: 14px; }

  .endpoint-box {
    border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px;
    margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
    background: #fafbfc; gap: 12px;
  }
  .endpoint-box .details { font-size: 14px; color: var(--text); }
  .endpoint-box .details .muted { color: var(--text-muted); }

  details summary {
    cursor: pointer; font-size: 14px; font-weight: 600; color: var(--primary);
    margin-bottom: 16px; list-style: none;
  }
  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: "▸ "; }
  details[open] summary::before { content: "▾ "; }
  .subsection { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .03em; margin: 20px 0 12px; }
  .subsection:first-child { margin-top: 0; }

  table { width: 100%; border-collapse: collapse; }
  table th, table td { text-align: left; padding: 8px 4px; border-bottom: 1px solid var(--border); font-size: 14px; }
  table th { color: var(--text-muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  table tr:last-child td { border-bottom: none; }
</style>
{{end}}
